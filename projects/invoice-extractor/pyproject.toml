[project]
name = "invoice-extractor"
version = "0.1.0"
description = "PDF invoices in, validated structured data out. Claude extracts; deterministic checks decide what a human sees."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Specter Systems" }]

dependencies = [
    "anthropic>=1.0",
    "pypdf>=6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
invoice-extract = "invoice_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_extractor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
